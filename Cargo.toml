[package]
name = "plz"
version = "0.1.0"
edition = "2021"
description = "CLI tool that converts natural language queries into shell commands via LLM"

[[bin]]
name = "plz"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
serial_test = "3"
